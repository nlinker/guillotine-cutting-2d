<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Cutting optimizer</title>
<style>
  body { font-family: monospace; max-width: 1000px; margin: 2em auto; padding: 0 1em; background: #fff; color: #111; }
  label { display: inline-flex; align-items: center; gap: .3em; }
  input[type=text], input[type=number] { font-family: monospace; }
  input[type=number] { width: 5.5em; }
  .row { display: flex; gap: 1.2em; align-items: center; margin: .6em 0; flex-wrap: wrap; }
  button { padding: .25em 1em; cursor: pointer; font-family: monospace; }
  #cancel { display: none; }
  #status { color: #888; }
  .error { color: red; }

  /* pieces input table */
  #pieces-table { border-collapse: collapse; margin: .5em 0; }
  #pieces-table th, #pieces-table td { border: 1px solid #ccc; padding: 2px 5px; }
  #pieces-table th { background: #f0f0f0; text-align: center; font-size: .85em; }
  #pieces-table td { text-align: center; }
  #pieces-table input[type=text]   { width: 9em; }
  #pieces-table input[type=number] { width: 4.5em; }
  .rm-btn { background: none; border: none; color: #c00; cursor: pointer; font-size: 1em; padding: 0 .2em; }

  pre { background: #f8f8f8; padding: 1em; overflow-x: auto; }
  h3 { margin: .6em 0 .2em; }
  #chart-wrap { margin: .4em 0; display: none; }
  #layout-wrap { margin: .8em 0; display: none; }
  #layout { width: 100%; }

  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #ddd; }
    input[type=text], input[type=number] { background: #1e1e1e; color: #ddd; border: 1px solid #444; }
    button { background: #242424; color: #ddd; border: 1px solid #555; }
    button:hover { background: #2e2e2e; }
    .rm-btn { background: none; border: none; color: #f07070; }
    #status { color: #999; }
    #pieces-table th { background: #222; }
    #pieces-table th, #pieces-table td { border-color: #404040; }
    pre { background: #1a1a1a; color: #ddd; }
    h2, h3 { color: #eee; }
  }
</style>
</head>
<body>
<h2>2D Guillotine Cutting Optimizer</h2>

<form id="form">
  <div class="row">
    <label>Sheet W <input type="number" id="sheet-w" value="2800" min="1"></label>
    <label>× H <input type="number" id="sheet-h" value="2070" min="1"></label>
    <label>Kerf <input type="number" id="kerf" value="7" min="0"></label>
  </div>

  <table id="pieces-table">
    <thead><tr>
      <th>Name</th><th>W</th><th>H</th><th>Count</th><th>Rotate</th><th></th>
    </tr></thead>
    <tbody id="pieces-tbody"></tbody>
  </table>
  <div class="row">
    <button type="button" id="add-row">+ Add row</button>
  </div>

  <div class="row">
    <label>Seed <input type="number" id="seed" value="42" min="0"></label>
    <label><input type="checkbox" id="random-seed" checked> random</label>
    <label>Threads <input type="number" id="threads" min="1" max="64"></label>
    <label>Gens <input type="number" id="gens" value="1000" min="10"></label>
    <label>Pop <input type="number" id="pop" value="200" min="10"></label>
    <label>Progress <input type="number" id="progress" value="50" min="1"></label>
    <label>Algorithm <select id="algorithm">
      <option value="glas" selected>GLAS</option>
      <option value="nfdh">NFDH</option>
      <option value="bfdh">BFDH</option>
      <option value="jylanki">Jylanki</option>
    </select></label>
    <button type="submit">Solve</button>
    <button type="button" id="cancel">Cancel</button>
    <span id="status"></span>
    <span id="sheets-live" style="display:none; color:#888">sheets: <b id="sheets-val">—</b></span>
  </div>
</form>

<div id="chart-wrap">
  <canvas id="chart" height="60"></canvas>
</div>
<div id="layout-wrap">
  <h3>Layout <label style="font-weight: normal"><input type="checkbox" id="draw-kerf" checked> draw with kerf</label></h3>
  <div id="layout"></div>
</div>
<div class="row">
  <button type="button" id="copy-genome" style="display:none">&#x1F4CB; Copy genome JSON</button>
  <span id="copy-genome-status"></span>
</div>
<div id="results"></div>

<!-- these js are served from run_serve -->
<script src="/web/chart.min.js"></script>
<script src="/web/svg.min.js"></script>
<script>
// note: this is the same as in src/render.rs
const PALETTE = ['#ffb6c1','#add8e6','#90ee90','#ffff99','#ffc87a','#dda0dd',
                 '#87ceeb','#f08080','#b4ffb4','#ffd8a8','#c8c8ff','#fff0b4'];

const DARK = window.matchMedia('(prefers-color-scheme: dark)').matches;
const T = DARK
  ? { sheetFill:'#222', sheetStroke:'#666', label:'#aaa', pieceStroke:'#555', pieceText:'#111', chartGrid:'#333', chartText:'#999' }
  : { sheetFill:'#f0f0f0', sheetStroke:'#333', label:'#555', pieceStroke:'#555', pieceText:'#000', chartGrid:'#e0e0e0', chartText:'#666' };

// == pieces table =============================================================
function addRow(p) {
  p = p || {name:'', width:'', height:'', count:1, can_rotate:false};
  const tbody = document.getElementById('pieces-tbody');
  const tr = document.createElement('tr');
  tr.innerHTML =
    `<td><input type="text"   value="${p.name}"></td>` +
    `<td><input type="number" value="${p.width ?? ''}" min="1"></td>` +
    `<td><input type="number" value="${p.height ?? ''}" min="1"></td>` +
    `<td><input type="number" value="${p.count}" min="1"></td>` +
    `<td><input type="checkbox"${p.can_rotate ? ' checked' : ''}></td>` +
    `<td><button class="rm-btn" type="button">×</button></td>`;
  tr.querySelector('.rm-btn').addEventListener('click', () => tr.remove());
  tbody.appendChild(tr);
}

function serializePieces() {
  return [...document.querySelectorAll('#pieces-tbody tr')].map(tr => {
    const inp = tr.querySelectorAll('input');
    return {
      name:       inp[0].value,
      width:      +inp[1].value,
      height:     +inp[2].value,
      count:      +inp[3].value,
      can_rotate:  inp[4].checked,
    };
  });
}

document.getElementById('threads').value = navigator.hardwareConcurrency || 8;
fetch('/web/real1.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('sheet-w').value = data.sheet.width;
    document.getElementById('sheet-h').value = data.sheet.height;
    document.getElementById('kerf').value    = data.kerf;
    data.piespecs.forEach(addRow);
  });
document.getElementById('add-row').addEventListener('click', () => addRow());

// == chart =====================================================================
let es = null;
let chart = null;

function initChart() {
  const canvas = document.getElementById('chart');
  if (chart) { chart.destroy(); }
  chart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'objective',
        data: [],
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.08)',
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.1,
        fill: true,
      }]
    },
    options: {
      animation: false,
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          title: { display: true, text: 'generation', color: T.chartText },
          ticks: { color: T.chartText },
          grid: { color: T.chartGrid },
        },
        y: {
          title: { display: true, text: 'layout score', color: T.chartText },
          ticks: { color: T.chartText, callback: (v) => v.toLocaleString() },
          grid: { color: T.chartGrid },
        }
      }
    }
  });
  document.getElementById('chart-wrap').style.display = 'block';
}

function addPoint(generation, objective) {
  chart.data.labels.push(generation);
  chart.data.datasets[0].data.push(objective);
  chart.update('none');
}

// == color helpers =============================================================
// Builds rowColor[piece_idx] = css color string.
// specs = array of piece types (piece_idx = index into specs).
function buildRowColors(specs) {
  return specs.map((_, ci) => PALETTE[ci % PALETTE.length]);
}


// == placements table =========================================================
// Copies {problem: {sheet, kerf, piespecs}, genome} to the clipboard so it can
// be pasted into demos/glas_decoder.html for step-by-step inspection.
function copyGenomeJson(d, statusEl) {
  const kerf = Number(document.getElementById('kerf').value) || 0;
  const payload = {
    problem: { sheet: { width: d.sheet_w, height: d.sheet_h }, kerf, piespecs: d.pieces },
    genome: d.genome,
  };
  navigator.clipboard.writeText(JSON.stringify(payload))
    .then(() => { statusEl.textContent = 'Copied!'; })
    .catch(err => { statusEl.textContent = 'Copy failed: ' + err; });
}

function buildResultSummary(elapsed, sheets, seed) {
  return `<p><b>Done in ${elapsed.toFixed(1)}s</b> - ${sheets} sheet(s), seed: ${seed}</p>`;
}

// == layout SVG ================================================================
// drawKerf=false: pieces drawn at true size (w, h); adjacent pieces show their
//   actual kerf gap (their placement coordinates already differ by w + kerf).
// drawKerf=true: pieces (and the sheet outline) are inflated by kerf to
//   (w + kerf, h + kerf) so that adjacent pieces sit flush against each other,
//   visually "absorbing" the cut width into each piece's footprint. The sheet
//   is inflated the same way so boundary pieces (kerf-exempt on that edge)
//   still align with the sheet edge instead of overflowing it.
function drawLayout(solution, pieces, sheetW, sheetH, kerf, drawKerf, rowColor) {
  const container = document.getElementById('layout');
  container.innerHTML = '';
  const placements = solution.placements;
  if (!placements || placements.length === 0) return;

  let nSheets = 0;
  for (const pl of placements) { if (pl.sheet_idx >= nSheets) nSheets = pl.sheet_idx + 1; }

  const pad = drawKerf ? kerf : 0;
  const effSheetW = sheetW + pad, effSheetH = sheetH + pad;

  const COLS = 2, GAP = 8, LABEL_H = 16;
  const nRows = Math.ceil(nSheets / COLS);
  const cw = 900;
  const sdw = (cw - GAP * (COLS - 1)) / COLS;
  const scale = sdw / effSheetW;
  const sdh = effSheetH * scale;
  const cellH = sdh + LABEL_H + GAP;
  const svgH = nRows * cellH - GAP;

  const draw = SVG().addTo(container).size(cw, svgH).attr('display', 'block');

  for (let i = 0; i < nSheets; i++) {
    const col = i % COLS, row = Math.floor(i / COLS);
    const ox = col * (sdw + GAP), oy = row * cellH;
    draw.rect(sdw, sdh).move(ox, oy)
      .fill(T.sheetFill).stroke({ color: T.sheetStroke, width: 1.5 });
    draw.plain('Sheet ' + i)
      .font({ size: 11, family: 'monospace' }).fill(T.label)
      .attr({ x: ox + 4, y: oy + sdh + 12 });
  }

  for (const pl of placements) {
    const pc = pieces[pl.piespec_idx];
    const pw = (pl.rotated ? pc.height : pc.width) + pad;
    const ph = (pl.rotated ? pc.width  : pc.height) + pad;
    const col = pl.sheet_idx % COLS, row = Math.floor(pl.sheet_idx / COLS);
    const ox = col * (sdw + GAP), oy = row * cellH;
    const rx = ox + pl.x * scale, ry = oy + pl.y * scale;
    const rw = Math.max(pw * scale, 0.5), rh = Math.max(ph * scale, 0.5);
    draw.rect(rw, rh).move(rx, ry)
      .fill(rowColor[pl.piespec_idx]).stroke({ color: T.pieceStroke, width: 0.5 });
    if (rw > 30 && rh > 14) {
      draw.plain(pc.name || ('#' + pl.piespec_idx))
        .font({ size: 9, family: 'monospace' }).fill(T.pieceText)
        .attr({ x: rx + 2, y: ry + 10 });
    }
  }
}

// == form submit ===============================================================
const seedInput      = document.getElementById('seed');
const randomSeedChk  = document.getElementById('random-seed');
const drawKerfChk    = document.getElementById('draw-kerf');
let lastSpecs = null;
let lastLayout = null; // { solution, pieces, sheetW, sheetH, kerf, rowColor }

// Checked = kerf gaps are visible (pieces at true size), i.e. the inverse of
// drawLayout's drawKerf flag, which inflates pieces to swallow the gaps.
drawKerfChk.addEventListener('change', () => {
  if (!lastLayout) return;
  const { solution, pieces, sheetW, sheetH, kerf, rowColor } = lastLayout;
  drawLayout(solution, pieces, sheetW, sheetH, kerf, !drawKerfChk.checked, rowColor);
});

document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (es) { es.close(); es = null; }
  document.getElementById('results').innerHTML = '';
  document.getElementById('layout-wrap').style.display = 'none';
  document.getElementById('copy-genome').style.display = 'none';
  document.getElementById('copy-genome-status').textContent = '';
  document.getElementById('status').textContent = 'running…';
  document.getElementById('cancel').style.display = 'inline';
  initChart();

  if (randomSeedChk.checked) {
    seedInput.value = Math.floor(Math.random() * 10000);
  }

  const params = new URLSearchParams();
  params.set('sheet_w',  document.getElementById('sheet-w').value);
  params.set('sheet_h',  document.getElementById('sheet-h').value);
  params.set('kerf',     document.getElementById('kerf').value);
  lastSpecs = serializePieces();
  params.set('pieces',   JSON.stringify(lastSpecs));
  params.set('seed',     seedInput.value);
  params.set('threads',  document.getElementById('threads').value);
  params.set('gens',     document.getElementById('gens').value);
  params.set('pop',      document.getElementById('pop').value);
  params.set('progress', document.getElementById('progress').value);
  params.set('algorithm', document.getElementById('algorithm').value);

  es = new EventSource('/stream?' + params);

  es.addEventListener('progress', (ev) => {
    const d = JSON.parse(ev.data);
    addPoint(d.generation, d.secondary_objective);
    document.getElementById('sheets-val').textContent = d.sheets_used;
    document.getElementById('sheets-live').style.display = 'inline';
  });

  es.addEventListener('done', (ev) => {
    const d = JSON.parse(ev.data);
    if (d.solution) {
      const rowColor = buildRowColors(d.pieces);
      const kerf = Number(document.getElementById('kerf').value);
      lastLayout = { solution: d.solution, pieces: d.pieces, sheetW: d.sheet_w, sheetH: d.sheet_h, kerf, rowColor };
      drawLayout(d.solution, d.pieces, d.sheet_w, d.sheet_h, kerf, !drawKerfChk.checked, rowColor);
      document.getElementById('layout-wrap').style.display = 'block';
    }
    document.getElementById('results').innerHTML =
      buildResultSummary(d.elapsed_secs, d.sheets_used, d.seed);
    const copyBtn = document.getElementById('copy-genome');
    const copyStatus = document.getElementById('copy-genome-status');
    copyStatus.textContent = '';
    if (d.genome) {
      copyBtn.style.display = '';
      copyBtn.onclick = () => copyGenomeJson(d, copyStatus);
    } else {
      copyBtn.style.display = 'none';
    }
    es.close(); es = null;
    document.getElementById('status').textContent = '';
    document.getElementById('sheets-live').style.display = 'none';
    document.getElementById('cancel').style.display = 'none';
  });

  es.addEventListener('error', (ev) => {
    if (ev.data) document.getElementById('results').innerHTML =
      '<p class="error">' + ev.data + '</p>';
    es.close(); es = null;
    document.getElementById('status').textContent = '';
    document.getElementById('sheets-live').style.display = 'none';
    document.getElementById('cancel').style.display = 'none';
  });

  es.onerror = () => {
    document.getElementById('status').textContent = 'connection error';
    document.getElementById('cancel').style.display = 'none';
    es = null;
  };
});

document.getElementById('cancel').addEventListener('click', () => {
  if (es) { es.close(); es = null; }
  document.getElementById('status').textContent = 'cancelled';
  document.getElementById('sheets-live').style.display = 'none';
  document.getElementById('cancel').style.display = 'none';
});

const gaOnlyIds = ['seed', 'random-seed', 'threads', 'gens', 'pop', 'progress'];
function applyAlgorithmState(value) {
  const isGA = ['glas'].includes(value);
  gaOnlyIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = !isGA;
  });
}
const algSelect = document.getElementById('algorithm');
algSelect.addEventListener('change', (e) => applyAlgorithmState(e.target.value));
applyAlgorithmState(algSelect.value);
</script>
</body>
</html>
