[package]
name = "guillotine-cutting-2d"
version = "0.1.0"
edition = "2024"

[lib]
name = "cut"
path = "src/lib.rs"

[[bin]]
name = "solver"
path = "src/main.rs"

[dependencies]
rand = "0.10"
rand_xoshiro = "0.8"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
smallvec = { version = "1", features = ["union", "serde"] }
chumsky = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

