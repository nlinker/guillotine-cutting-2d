[package]
name = "cutting"
version = "0.1.0"
edition = "2024"

[lib]
name = "cutting"
path = "src/lib.rs"

[dependencies]
rand = "0.10"
rand_xoshiro = "0.8"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }

